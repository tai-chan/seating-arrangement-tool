<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>座席配置図作成ツール</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>座席配置図作成ツール</h1>
    <div class="topbar-actions">
      <div class="wizard">
        <select id="wiz-screens" title="スクリーンの数">
          <option value="1">スクリーン1台</option>
          <option value="2">スクリーン2台</option>
          <option value="3">スクリーン3台</option>
        </select>
        <select id="wiz-desk-type" title="机の形">
          <option value="idesk2">I字机 2:2</option>
          <option value="idesk3" selected>I字机 3:3</option>
          <option value="tdesk">T字机</option>
          <option value="round">丸机</option>
        </select>
        <label class="wiz-label">横<input id="wiz-max-cols" type="number" min="1" max="10" value="3" title="横に何個"></label>
        <label class="wiz-label">机の数<input id="wiz-desk-count" type="number" min="1" max="30" value="6" title="机の数"></label>
        <button id="btn-generate" class="tpl-btn tpl-btn-primary">自動配置</button>
      </div>
      <button id="btn-undo" class="tpl-btn" disabled title="Cmd+Z / Ctrl+Zでも戻せます">元に戻す</button>
      <button id="btn-relabel" class="tpl-btn">ラベルを振り直す</button>
      <button id="btn-recolor" class="tpl-btn">色を振り直す</button>
      <button id="btn-export" class="export-btn">PNG書き出し</button>
    </div>
  </header>

  <div class="main">
    <aside class="palette">
      <h2>アイテムを配置</h2>
      <button data-type="idesk" data-seats="2">I字机 2:2</button>
      <button data-type="idesk" data-seats="3">I字机 3:3</button>
      <button data-type="tdesk">T字机</button>
      <button data-type="round">丸机</button>
      <button data-type="screen">スクリーン</button>
      <button data-type="podium">MC席</button>
      <button data-type="mc">MC</button>
      <button data-type="secretariat-desk">事務局机</button>
      <button data-type="secretariat-person">事務局</button>
      <button data-type="text">テキスト</button>
      <p class="hint">配置後はドラッグで移動、四隅のハンドルで回転・拡大縮小できます。Delete/Backspaceキーで削除。机はダブルクリックでラベルを変更できます。テキストや各アイテム上の文字はダブルクリックでその場編集できます。Cmd+Z / Ctrl+Zまたは「元に戻す」ボタンで操作を取り消せます。</p>
    </aside>

    <div class="canvas-wrap">
      <canvas id="seat-canvas" width="1200" height="900"></canvas>
    </div>

    <aside id="inspector" class="inspector empty">
      <h2 id="inspector-title"></h2>
      <div id="inspector-body"></div>
      <p class="empty-msg">机やスクリーンをクリックすると、ここに詳細設定が表示されます。</p>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <script src="js/shapes.js?v=20260815"></script>
  <script src="js/labeling.js?v=20260815"></script>
  <script src="js/templates.js?v=20260815"></script>
  <script src="js/inspector.js?v=20260815"></script>
  <script src="js/app.js?v=20260815"></script>
</body>
</html>
